<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2a47">
<title>Mes vœux P1/P2 2026</title>
<script>document.documentElement.dataset.theme = localStorage.getItem("voeux-theme") || "light";</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Mes vœux<span class="wide"> P1/P2 2026</span></h1>
  <span id="deadline" class="deadline"></span>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="classement" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span>Classement</span></button>
    <button role="tab" data-view="calendrier" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendrier</span></button>
    <button role="tab" data-view="comparer" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="7" height="16" rx="1.5"/><rect x="13.5" y="4" width="7" height="16" rx="1.5"/></svg><span>Comparer</span></button>
    <button role="tab" data-view="profs" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.6 3-5.5 6-5.5s5.4 1.9 6 5.5M16 5.2a3 3 0 0 1 0 5.6M18 14.8c1.7.7 2.7 2.4 3 5.2"/></svg><span>Profs</span></button>
    <button role="tab" data-view="parcours" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 20v-7M11 20V5M16 20v-10M20.5 20v-4"/></svg><span>Parcours<span class="wide"> 25-26</span></span></button>
  </nav>
  <button id="menu" class="ghost menu-btn" aria-label="Options" aria-expanded="false">⋯</button>
  <div class="actions">
    <select id="preset" aria-label="Charger un parcours type">
      <option value="">Parcours type…</option>
    </select>
    <button id="reset" class="ghost" title="Revenir à l'ordre de la campagne">Réinitialiser</button>
    <button id="theme" class="ghost" title="Changer de thème" aria-label="Changer de thème"></button>
  </div>
</header>

<main id="view-classement" class="view layout">
  <section class="board">
    <div id="mcamps" class="seg mcamps" role="tablist" aria-label="Campagne"></div>
    <div id="legend" class="legend"></div>
    <div id="columns" class="columns"></div>
  </section>
  <div id="sheet-bg" class="sheet-bg"></div>
  <aside id="detail" class="detail" aria-live="polite"></aside>
</main>

<main id="view-calendrier" class="view" hidden>
  <div class="cal-head">
    <div id="cal-picks" class="cal-picks"></div>
    <div id="cal-legend" class="cal-legend small"></div>
  </div>
  <div id="cal-summary" class="cal-summary"></div>
  <div id="cal-grid" class="cal-grid"></div>
  <div id="cal-pop" class="pop" role="dialog" aria-label="Détail de la journée" hidden></div>
</main>

<main id="view-comparer" class="view cmp-view" hidden>
  <div class="cmp-bar">
    <div class="seg" id="cmp-camps" role="group" aria-label="Campagne"></div>
    <div id="cmp-chips" class="chips"></div>
    <span class="faint small">4 modules max</span>
  </div>
  <div id="cmp-grid" class="cmp-grid"></div>
</main>

<main id="view-profs" class="view split" hidden>
  <section class="mx-wrap">
    <div class="mx-head">
      <h2>Qui enseigne en P1/P2 et dans une VAP ?</h2>
      <span class="mx-key"><span><b class="mk r">●</b> un prof du module est <b>responsable</b> dans la VAP</span><span><b class="mk">○</b> il fait partie de l'<b>équipe</b></span><span class="faint">clic sur une case, un module ou une filière</span></span>
    </div>
    <div id="profs-mx" class="mx"></div>
  </section>
  <aside id="profs-side" class="detail"></aside>
</main>

<main id="view-parcours" class="view split" hidden>
  <section class="mx-wrap">
    <div class="mx-head">
      <h2 id="pc-title"></h2>
      <div class="seg" id="pc-mode" role="group" aria-label="Lecture">
        <button data-mode="pris" aria-pressed="true">Ce qu'ils avaient pris</button>
        <button data-mode="vers" aria-pressed="false">Où sont allés ceux qui l'ont pris</button>
      </div>
      <span id="pc-hint" class="small muted"></span>
    </div>
    <div id="pc-mx" class="mx"></div>
  </section>
  <aside id="pc-side" class="detail"></aside>
</main>

<dialog id="avis-modal">
  <form method="dialog" class="modal-head"><h2 id="avis-title"></h2><button class="ghost" aria-label="Fermer">✕</button></form>
  <div id="avis-body" class="modal-body"></div>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
</body>
</html>
